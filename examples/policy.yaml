# ---------------------------------------------------------------------------
# HeaderSpecter custom header policy
#
#   headerspecter https://example.com --policy examples/policy.yaml
#
# Everything below is optional — remove what you do not need.
# ---------------------------------------------------------------------------

name: Corporate web baseline
description: >
  Minimum HTTP response header requirements for internet facing web
  applications. Reviewed quarterly by the application security team.

# Headers that MUST be present on every response.
# A missing header raises HS-900.
required:
  - content-security-policy
  - strict-transport-security
  - x-content-type-options
  - referrer-policy
  - permissions-policy
  - cross-origin-opener-policy

# Headers that must NOT be present (information disclosure / deprecated).
# A present header raises HS-901.
forbidden:
  - x-powered-by
  - x-aspnet-version
  - x-aspnetmvc-version
  - public-key-pins
  - expect-ct

# Headers that are nice to have. They are not enforced, but are listed here
# for documentation purposes and future tooling.
optional:
  - cross-origin-resource-policy
  - cross-origin-embedder-policy
  - x-permitted-cross-domain-policies
  - clear-site-data

# Approved values. A literal list means "one of these"; prefix a value with
# `re:` to match with a regular expression. A mismatch raises HS-902.
values:
  x-content-type-options:
    - nosniff
  x-frame-options:
    - DENY
    - SAMEORIGIN
  referrer-policy: "re:^(no-referrer|same-origin|strict-origin|strict-origin-when-cross-origin)$"
  strict-transport-security: "re:max-age=(3153[6-9][0-9]{3}|[4-9][0-9]{7,})"   # >= 1 year
  cross-origin-opener-policy:
    - same-origin
    - same-origin-allow-popups

# Severity overrides. Keys may be a finding id (HS-100) or a header name;
# values are CRITICAL / HIGH / MEDIUM / LOW / INFO.
severity:
  HS-100: critical            # missing CSP is a release blocker for us
  HS-001: critical            # missing HSTS likewise
  content-security-policy: high
  x-powered-by: medium
  permissions-policy: low

# Scoring overrides merged into the built-in scoring model.
scoring:
  base_score: 100
  severity_weights:
    CRITICAL: 30
    HIGH: 16
    MEDIUM: 8
    LOW: 3
    INFO: 0.5
  header_multipliers:
    content-security-policy: 1.3
    strict-transport-security: 1.2
    set-cookie: 1.1
  category_caps:
    csp: 34
    cookies: 26

# Used by CI: `headerspecter ... --policy policy.yaml` exits with code 2 when
# the score drops below this value (equivalent to --min-score).
min_score: 80
